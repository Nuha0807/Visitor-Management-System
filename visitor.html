<!DOCTYPE html>
<html>

<head>
    <title>Visitors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }

        .header {
            background-color: #4e73df;
            color: white;
            padding: 15px 30px;
        }

        .header h2 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .top-links {
            margin-bottom: 20px;
        }

        .top-links a {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 14px;
        }

        .back-btn {
            background-color: #858796;
            color: white;
        }

        .logout-btn {
            background-color: #e74a3b;
            color: white;
        }

        .back-btn:hover {
            background-color: #6c757d;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #4e73df;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .status-in {
            color: green;
            font-weight: bold;
        }

        .status-out {
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="header">
        <h2>Visitor Management</h2>
    </div>

    <div class="container">

        <div class="top-links">
            <a href="{{ url_for('dashboard') }}" class="back-btn">⬅ Back to Dashboard</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

        <h3>Visitor List</h3>

        <table>
            <tr>
                <th>Name</th>
                <th>Company</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>Tech Corp</td>
                <td class="status-in">Checked In</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td>Digital Solutions</td>
                <td class="status-out">Checked Out</td>
            </tr>
        </table>

    </div>

</body>

</html>
