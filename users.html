<!DOCTYPE html>
<html>

<head>
    <title>User Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }

        .header {
            background-color: #4e73df;
            color: white;
            padding: 15px 30px;
        }

        .header h2 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .top-links {
            margin-bottom: 20px;
        }

        .top-links a {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 14px;
            color: white;
        }

        .back-btn {
            background-color: #858796;
        }

        .logout-btn {
            background-color: #e74a3b;
        }

        .back-btn:hover {
            background-color: #6c757d;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .user-table th {
            background-color: #4e73df;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .user-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .user-table tr:hover {
            background-color: #f1f3f9;
        }

        .role-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
        }

        .admin {
            background-color: #1cc88a;
        }

        .security {
            background-color: #36b9cc;
        }

        .reception {
            background-color: #f6c23e;
        }
    </style>

</head>

<body>

    <div class="header">
        <h2>User Management</h2>
    </div>

    <div class="container">

        <div class="top-links">
            <a href="{{ url_for('dashboard') }}" class="back-btn">⬅ Back to Dashboard</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

        <h3>System Users</h3>

        <table class="user-table">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
            <tr>
                <td>Admin User</td>
                <td>admin@company.com</td>
                <td><span class="role-badge admin">Admin</span></td>
            </tr>
            <tr>
                <td>Security User</td>
                <td>security@company.com</td>
                <td><span class="role-badge security">Security</span></td>
            </tr>
            <tr>
                <td>Reception User</td>
                <td>reception@company.com</td>
                <td><span class="role-badge reception">Reception</span></td>
            </tr>
        </table>

    </div>

</body>

</html>
