<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Visitor Management System - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .container h2 span {
            display: inline-block;
            font-size: 1.8rem;
        }

        form label {
            display: block;
            margin: 1rem 0 0.25rem;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: linear-gradient(to right, #5a67d8, #6b46c1);
        }

        .credentials {
            background-color: #f1f1f1;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .credentials strong {
            display: block;
            margin-bottom: 0.5rem;
        }

        .emoji {
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2><span class="emoji">🏢</span> Visitor Management System</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email</label>
            <input type="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" name="password" required>

            <label for="role">Role</label>
            <select name="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="Admin">Admin</option>
                <option value="Security">Security</option>
                <option value="Reception">Reception</option>
            </select>

            <button type="submit" class="btn">Login</button>
        </form>
        <!---
        <div class="credentials">
            <strong>Demo Credentials:</strong>
            Admin: admin@company.com / admin123<br>
            Security: security@company.com / security123<br>
            Reception: reception@company.com / reception123
        </div>-->
    </div>
</body>

</html>
