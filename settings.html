<!DOCTYPE html>
<html>

<head>
    <title>System Settings</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }

        .header {
            background-color: #4e73df;
            color: white;
            padding: 15px 30px;
        }

        .header h2 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .top-links {
            margin-bottom: 20px;
        }

        .top-links a {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 14px;
            color: white;
        }

        .back-btn {
            background-color: #858796;
        }

        .logout-btn {
            background-color: #e74a3b;
        }

        .back-btn:hover {
            background-color: #6c757d;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .setting-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .setting-card:hover {
            background-color: #e2e6f5;
            transform: translateY(-4px);
        }

        .setting-title {
            font-weight: bold;
            color: #4e73df;
            font-size: 16px;
        }
    </style>

</head>

<body>

    <div class="header">
        <h2>System Settings</h2>
    </div>

    <div class="container">

        <div class="top-links">
            <a href="{{ url_for('dashboard') }}" class="back-btn">⬅ Back to Dashboard</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

        <h3>Settings Options</h3>

        <div class="settings-grid">

            <div class="setting-card">
                <div class="setting-title">🔒 Change Password</div>
            </div>

            <div class="setting-card">
                <div class="setting-title">👤 Update Profile</div>
            </div>

            <div class="setting-card">
                <div class="setting-title">🔔 Notification Settings</div>
            </div>

            <div class="setting-card">
                <div class="setting-title">💾 System Backup</div>
            </div>

        </div>

    </div>

</body>

</html>
